<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1400" height="850" fill="#f8fafc"/>

  <!-- title -->
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">Agent teams: Slack bot + two machines</text>
  <text x="40" y="78" font-size="14" fill="#64748b">Identity &lt;person&gt;/claude/&lt;lane&gt; · Agent Mail name in grey (example)</text>

  <!-- panels -->
  <rect x="40" y="370" width="640" height="370" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="64" y="400" font-size="18" font-weight="700" fill="#1d4ed8">machine1 (macOS)</text>
  <text x="64" y="722" font-size="13" fill="#1e40af">checkouts &lt;repo&gt;, &lt;repo&gt;-1, -2, -3, -deploy</text>

  <rect x="720" y="370" width="640" height="370" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="744" y="400" font-size="18" font-weight="700" fill="#047857">machine2 (Windows)</text>
  <text x="744" y="722" font-size="13" fill="#065f46">checkouts &lt;repo&gt;, &lt;repo&gt;-1, -2, -3</text>

  <!-- edges: person -->
  <line x1="700" y1="152" x2="700" y2="214" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrP)"/>
  <text x="712" y="190" font-size="13" fill="#6d28d9">Slack DM / @&lt;bot-name&gt;</text>

  <path d="M570,122 C330,122 300,250 300,412" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrG)"/>
  <text x="250" y="160" font-size="13" fill="#64748b" text-anchor="middle">terminal / Remote Control</text>
  <path d="M830,122 C1070,122 1100,250 1100,412" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrG)"/>
  <text x="1150" y="160" font-size="13" fill="#64748b" text-anchor="middle">terminal / Remote Control</text>

  <!-- edges: bot to managers -->
  <line x1="630" y1="300" x2="420" y2="410" stroke="#7c3aed" stroke-width="2.5" marker-start="url(#arrP)" marker-end="url(#arrP)"/>
  <text x="470" y="345" font-size="13" fill="#6d28d9" text-anchor="middle">Agent Mail</text>
  <line x1="770" y1="300" x2="980" y2="410" stroke="#7c3aed" stroke-width="2.5" marker-start="url(#arrP)" marker-end="url(#arrP)"/>
  <text x="930" y="345" font-size="13" fill="#6d28d9" text-anchor="middle">Agent Mail</text>

  <!-- bot to shared channel -->
  <line x1="912" y1="258" x2="1136" y2="258" stroke="#7c3aed" stroke-width="2.5" marker-start="url(#arrP)" marker-end="url(#arrP)"/>
  <rect x="922" y="268" width="130" height="20" rx="10" fill="#f8fafc"/>
  <text x="987" y="282" font-size="12" fill="#6d28d9" text-anchor="middle">posts you OK · replies</text>

  <!-- manager to manager -->
  <line x1="512" y1="452" x2="888" y2="452" stroke="#475569" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="586" y="424" width="228" height="22" rx="11" fill="#f8fafc"/>
  <rect x="596" y="461" width="208" height="20" rx="10" fill="#f8fafc"/>
  <text x="700" y="440" font-size="13" fill="#334155" text-anchor="middle">work for the other machine</text>
  <text x="700" y="474" font-size="12" fill="#64748b" text-anchor="middle">(deploys always go to m1/me)</text>

  <!-- manager to workers: Mac -->
  <g stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)">
    <line x1="330" y1="492" x2="126" y2="596"/>
    <line x1="350" y1="492" x2="282" y2="596"/>
    <line x1="370" y1="492" x2="438" y2="596"/>
    <line x1="390" y1="492" x2="594" y2="596"/>
  </g>
  <!-- manager to workers: Windows -->
  <g stroke="#10b981" stroke-width="2" marker-end="url(#arr)">
    <line x1="1020" y1="492" x2="884" y2="596"/>
    <line x1="1040" y1="492" x2="1040" y2="596"/>
    <line x1="1060" y1="492" x2="1196" y2="596"/>
  </g>
  <text x="64" y="530" font-size="12" fill="#1e40af">tasks ↓  reports ↑</text>
  <text x="1260" y="545" font-size="12" fill="#065f46" text-anchor="middle">tasks ↓  reports ↑</text>

  <!-- person -->
  <rect x="570" y="92" width="260" height="60" rx="30" fill="#0f172a"/>
  <text x="700" y="128" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;person&gt;</text>

  <!-- bot -->
  <rect x="490" y="216" width="420" height="84" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="700" y="246" font-size="20" font-weight="700" fill="#4c1d95" text-anchor="middle">&lt;bot-name&gt;</text>
  <text x="700" y="268" font-size="13" fill="#5b21b6" text-anchor="middle">&lt;person&gt;/claude/&lt;bot-name&gt; · <tspan fill="#94a3b8">FuchsiaDune</tspan></text>
  <text x="700" y="288" font-size="12" fill="#6d28d9" text-anchor="middle">Claude Code in an sbx VM on machine1 · mails only the managers</text>

  <!-- shared channel -->
  <rect x="1140" y="216" width="220" height="84" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1250" y="244" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">shared Slack channel</text>
  <text x="1250" y="266" font-size="12" fill="#5b21b6" text-anchor="middle">#&lt;agent-coordination-channel&gt;</text>
  <text x="1250" y="286" font-size="12" fill="#6d28d9" text-anchor="middle">other agents, e.g. &lt;other-bot&gt;</text>

  <!-- managers -->
  <rect x="210" y="414" width="300" height="78" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="444" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">m1/me</text>
  <text x="360" y="464" font-size="13" fill="#94a3b8" text-anchor="middle">ProudOak</text>
  <text x="360" y="482" font-size="12" fill="#1e40af" text-anchor="middle">manager · &lt;repo&gt;</text>

  <rect x="890" y="414" width="300" height="78" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2.5"/>
  <text x="1040" y="444" font-size="20" font-weight="700" fill="#064e3b" text-anchor="middle">m2/me</text>
  <text x="1040" y="464" font-size="13" fill="#94a3b8" text-anchor="middle">MaroonAspen</text>
  <text x="1040" y="482" font-size="12" fill="#065f46" text-anchor="middle">manager · &lt;repo&gt;</text>

  <!-- Mac workers -->
  <g font-size="12" text-anchor="middle">
    <rect x="56" y="600" width="140" height="84" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="126" y="628" font-size="17" font-weight="700" fill="#1e3a8a">m1/w1</text>
    <text x="126" y="648" fill="#94a3b8">GentleValley</text>
    <text x="126" y="668" fill="#475569">&lt;repo&gt;-1</text>

    <rect x="212" y="600" width="140" height="84" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="282" y="628" font-size="17" font-weight="700" fill="#1e3a8a">m1/w2</text>
    <text x="282" y="648" fill="#94a3b8">LavenderSquirrel</text>
    <text x="282" y="668" fill="#475569">&lt;repo&gt;-2</text>

    <rect x="368" y="600" width="140" height="84" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="438" y="628" font-size="17" font-weight="700" fill="#1e3a8a">m1/w3</text>
    <text x="438" y="648" fill="#94a3b8">SageOak</text>
    <text x="438" y="668" fill="#475569">&lt;repo&gt;-3</text>

    <rect x="524" y="600" width="140" height="84" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
    <text x="594" y="628" font-size="17" font-weight="700" fill="#9a3412">m1/deploy</text>
    <text x="594" y="648" fill="#94a3b8">PearlGlacier</text>
    <text x="594" y="668" fill="#9a3412">all deployments</text>
    <text x="594" y="704" fill="#9a3412">&lt;repo&gt;-deploy</text>
  </g>

  <!-- Windows workers -->
  <g font-size="12" text-anchor="middle">
    <rect x="814" y="600" width="140" height="84" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <text x="884" y="628" font-size="17" font-weight="700" fill="#064e3b">m2/w1</text>
    <text x="884" y="648" fill="#94a3b8">AzureCove</text>
    <text x="884" y="668" fill="#475569">&lt;repo&gt;-1</text>

    <rect x="970" y="600" width="140" height="84" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <text x="1040" y="628" font-size="17" font-weight="700" fill="#064e3b">m2/w2</text>
    <text x="1040" y="648" fill="#94a3b8">TopazLeopard</text>
    <text x="1040" y="668" fill="#475569">&lt;repo&gt;-2</text>

    <rect x="1126" y="600" width="140" height="84" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <text x="1196" y="628" font-size="17" font-weight="700" fill="#064e3b">m2/w3</text>
    <text x="1196" y="648" fill="#94a3b8">PearlCat</text>
    <text x="1196" y="668" fill="#475569">&lt;repo&gt;-3</text>
  </g>

  <!-- footer -->
  <text x="40" y="782" font-size="14" fill="#334155">All mail goes through Agent Mail on machine1 (127.0.0.1:8765); machine2 reaches it over Tailscale.</text>
  <text x="40" y="806" font-size="14" fill="#334155">Workers take tasks only from their own manager. Destructive or outward-facing actions need &lt;person&gt;'s OK: in the worker's session, or quoted by its manager.</text>
</svg>
